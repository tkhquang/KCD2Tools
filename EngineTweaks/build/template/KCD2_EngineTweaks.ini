; KCD2_EngineTweaks settings. Changes apply while the game runs.

[Settings]
; TRACE, DEBUG, INFO, WARNING or ERROR. INFO logs a summary of every fix at most once a minute. DEBUG adds each
; notable event. TRACE adds each fixed call, for test runs only.
LogLevel = INFO
; Master switch. false turns every fix off.
Enabled = true

[Fixes]
; Full-screen menus (inventory, map, journal...) no longer change the view distance, which rebuilt the whole scene.
MenuViewDistance = true
; Destroying an item finds its links through an index instead of a scan of every link in the game.
LinkIndex = true
; Clearing an inventory refreshes its item flags once instead of once per item.
InventoryRefresh = true
; Copying perks runs the perk auto-unlock check once instead of once per perk.
PerkCopy = true
; The bed prompt simulates only the hours it reads instead of a whole day.
SleepPrediction = true
; That simulation also leaves Henry's items out. The prediction is identical for every hour.
SleepPredictionWithoutItems = true

[Debug]
; Checks every indexed unlink against a full scan of the link map. That scan is the freeze LinkIndex removes.
VerifyLinkIndex = false
; Compares every sleep prediction built without items with builds with them, hour by hour. Three builds each.
VerifySleepPrediction = false
