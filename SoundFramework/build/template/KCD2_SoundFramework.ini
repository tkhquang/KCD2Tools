; KCD2_SoundFramework - custom sounds and voices for KCD2.
;
; Put this file next to KCD2_SoundFramework.asi. Saving it applies the changes while playing, except
; [LipSync] Enabled, which needs a restart.

[Settings]
; TRACE, DEBUG, INFO, WARNING, ERROR.
LogLevel=INFO

[Debug]
; Logs every game sound event whose path contains this text ("*" = all, empty = off). Handy for finding the
; event:/ paths a pack's Replaces key needs.
EventLog=
; Logs every voice line the game speaks (dialog, barks) whose file path or text key contains this text
; ("*" = all, empty = off). Handy for finding the line ids a pack's ReplacesVoice key needs.
SpeakLog=

[LipSync]
; Lines without lip-sync animation get mouth movement from the voice itself (true/false). Off means the face pose hook
; is not installed at all. Needs a restart.
Enabled=true
; ADVANCED: a small network trained on the game's own voice lines and facial animation moves the whole lower face
;           (jaw, lips, mouth corners, smile lines); needs KCD2_SoundFramework_lipmodel.bin beside this file.
; BASIC:    jaw and lip shapes from the voice's loudness and spectrum (the fallback when the model file is missing).
; Applies from the next line.
Mode=ADVANCED
; Shifts that mouth movement in milliseconds: positive moves the mouth earlier than the sound, negative later.
; Live: sfw_lipsync_offset <ms>.
OffsetMs=0
