; KCD2_SoundFramework - default moods.
;
; A mood is a set of face pose weights that a voice line holds while it plays:
;     [name]
;     Poses = pose:weight, pose:weight, ...      ; weights 0..2
;     MaxStrength = 1                            ; optional, 0..2: the most any line scales this mood
; Voice lines use one with `Mood = name`, and `MoodStrength = 0..2` to tone it down (below 1) or exaggerate it
; (above 1).
;
; Pose names are the face rig's pose bones without the FA_POSE_ prefix: C_ (centre), L_ / R_ (left / right side), e.g.
; L_browsLowerer, R_cheekRaiser, C_chinRaise. On lines that have the game's own lip-sync animation only the upper-face
; poses apply (brows, eyes, cheeks, nose), so the mouth stays Warhorse's.
;
; This file is replaced on update. To change a mood for good, define it again (same name) in your own pack:
;     Mods/<your mod>/SoundFramework/moods.ini
; Packs load after this file, so the pack's definition wins. In game, `sfw_mood_override <mood> pose:weight ...`
; tries values live and `sfw_mood_dump <mood>` writes the current ones to the log, ready to paste.

