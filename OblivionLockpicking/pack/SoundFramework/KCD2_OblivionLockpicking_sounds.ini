; KCD2_OblivionLockpicking - the lock's sounds, a Sound Framework pack.
;
; The lockpicking mod plays these sounds by name as the tumblers move. Each one plays one of the game's own sound
; events with its own pitch and volume (Events), so no audio is shipped. To use other sounds, define the same names
; in a pack that loads later, with Files or other Events. See the Sound Framework modding guide for every key.

; The pick pushes a tumbler up: the vanilla sweet-spot tick, brighter.
[kcd2_oblivionlockpicking_push]
Events = event:/special/lockpicking/onplace
Space = 2d
Pitch = 1.4
Volume = 2
PitchVariation = 0.05

; A slow tumbler reaches the top: a sharp double click, lower and wider apart. It pauses after this one, so this is
; the moment to set it.
[kcd2_oblivionlockpicking_top_slow]
Events = event:/ui/skiptime/ui_skiptime_turn
Space = 2d
Pitch = 0.85
Volume = 4

; A fast tumbler reaches the top: the same double click, higher and quicker. It drops at once.
[kcd2_oblivionlockpicking_top_fast]
Events = event:/ui/skiptime/ui_skiptime_turn
Space = 2d
Pitch = 1.15
Volume = 4

; A slow tumbler leaves the top and ratchets down its chamber.
[kcd2_oblivionlockpicking_fall]
Events = event:/ui/menu/ui_menu_change_focus
Space = 2d
Pitch = 0.6
Volume = 4

; A tumbler lands back at rest.
[kcd2_oblivionlockpicking_land]
Events = event:/combat/weapons/crossbow/crossbow_loading_nut1
Space = 2d
Volume = 0.15
PitchVariation = 0.05

; A tumbler is set: the latch snaps in and rattles as it settles.
[kcd2_oblivionlockpicking_set]
Events = event:/foleys/general/door/door_unlock
Space = 2d
Pitch = 1.3
