; KCD2_OblivionLockpicking - replaces the lockpicking minigame with an Oblivion-style tumbler lock.
;
; Keep this file next to KCD2_OblivionLockpicking.asi (ASI build) or KCD2_OblivionLockpicking.dll (KCSE build).
; Changes apply while the game runs.
;
; Push each tumbler up and set it while it pauses at the top. A set while it rises or falls is a wrong set, and the
; game rolls whether the pick breaks. Each push rolls one of three speeds, never the speed of the push before, and a
; slow tumbler clicks later than a fast one (and lower, with Sound Framework). Push a falling tumbler again and it keeps
; its speed, and hold the push to make it bounce. Thievery, perks and buffs slow every tumbler down.

[Settings]
; TRACE, DEBUG, INFO, WARNING, ERROR. TRACE also logs the mouse and stick inputs once per second and every set, push
; and move key, for tuning MousePickSpeed and PushFlick or checking a binding.
LogLevel=INFO

; false gives the vanilla minigame back.
Enabled=true

; The set tumblers a wrong set leaves up.
;   Thievery: as many as your Thievery level earns, as Oblivion's Security masteries did: none below level 8, one
;             from 8, two from 15, three from 23, four at 30. The ones set first stay. If the level cannot be read,
;             all of them stay.
;   All: all of them (easier).
;   None: none (Oblivion's Novice rule).
KeepSetTumblersOnFail=Thievery

; Seconds the controls pause after a wrong set (0-10). Oblivion pauses them for 0.8 s. Henry plays no failure
; animation, so the view stays still. 0 plays the game's own 3.4 s failure animation instead.
FailLockoutSeconds=0.8

; The lock's sounds. With Sound Framework, every push, click at the top, landing and set has its own sound, and a slow
; tumbler slides down audibly. Without it, the game's lock click plays when a tumbler reaches the top.
TumblerSounds=true

; Nearby NPCs can hear a tumbler in motion, with the same perks and buffs that quiet the vanilla minigame.
; NoiseDistance feeds the game's own noise formula (0 quietest, 2 loudest).
NoiseEnabled=true
NoiseDistance=1.0

[Controls]
; The game's key names, separated by commas, up to eight per list. Leave a list empty for none. While a lock is open,
; these keys do nothing else in the game.
;   Mouse: mouse1 (left), mouse2 (right), mouse3 (middle), mouse4, mouse5.
;   Keyboard: the letter or digit (d, 1), or space, tab, enter, lshift, rshift, lctrl, rctrl, lalt, ralt.
;   Controller: xi_a, xi_b, xi_x, xi_y, xi_shoulderl (LB), xi_shoulderr (RB), xi_triggerl (LT), xi_triggerr (RT),
;     xi_dpad_up, xi_dpad_down, xi_dpad_left, xi_dpad_right, xi_thumbl, xi_thumbr, xi_start, xi_back.
;     On a PlayStation controller xi_a is Cross, xi_b Circle, xi_x Square, xi_y Triangle.

; Move the pick one tumbler left or right. A held key repeats the step. The mouse and the stick move it as well.
MoveLeftKeys=a, xi_dpad_left
MoveRightKeys=d, xi_dpad_right

; Set the tumbler at the top.
SetKeys=space, mouse1, xi_a

; Push the tumbler under the pick, as the mouse and the stick do when they move up. Hold to make it bounce.
PushKeys=w, xi_dpad_up

; The stick that moves the pick and pushes when pushed up: Left, Right or None.
PadStick=Left

; false: a set on a tumbler at rest does nothing, as in Oblivion and the Remaster. true: it pushes the tumbler, so a
; quick double click pushes and sets, which sets most tumblers without timing.
SetPushesRestingTumbler=false

; true: an upward mouse move pushes, as in Oblivion. PushFlick is how far up counts as a push (0.02-5), in the game's
; lockpicking mouse units. MousePickSpeed does not change it.
PushWithMouseUp=true
PushFlick=0.25

; Tumblers per unit of the game's lockpicking mouse movement (0-20), which already includes the game's mouse
; sensitivity.
MousePickSpeed=1.0

; Tumblers per second with the stick pushed all the way (0-50).
PadPickSpeed=6.0

[Difficulty]
; Multiplies every tumbler timing (0.1-10). Above 1 is slower and easier.
TimeScale=1.0

; Your skill against a lock comes from the game's sweet-spot size for it (Thievery, perks, buffs, drunkenness and the
; lock's difficulty). These are the sizes that count as no skill (0-0.95) and as full skill (up to 1).
ToleranceMin=0.05
ToleranceMax=0.45

; Tumbler speed at no skill and at full skill, as Oblivion's lock speed (0.05-1): 1 is a Very Hard lock at low
; Security, three speeds far apart, the fastest with almost no pause. 0.1 is a Very Easy one, every push slow.
SpeedNoSkill=1.0
SpeedFullSkill=0.1

; true: the pick stays under its tumbler until no tumbler moves, as in Oblivion. Harder.
OneTumblerAtATime=false

; Seconds after a tumbler leaves the top during which a set still counts (0-0.2). The default absorbs one frame of
; input and display lag. 0 is Oblivion's strict rule. A longer grace keeps fast tumblers settable later, so one fixed
; push-and-set rhythm starts to set most tumblers.
SetGraceSeconds=0.017

[View]
; true hides the vanilla lock while the tumbler lock is up.
HideVanillaView=true

; Size of the tumbler lock (0.25-4).
LockScale=1.0

; false hides the bar above the lock (tumblers set and difficulty).
ShowHeader=true

; false hides the control hints below the lock.
ShowFooter=true
