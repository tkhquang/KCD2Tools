; KCD2_HotPak - dev tool: reloads a rebuilt mod pak in the running game. Not for normal play; use at your own risk.
;
; Put this file next to KCD2_HotPak.asi. Changes apply while the game runs.

[Settings]
; TRACE, DEBUG, INFO, WARNING, ERROR.
LogLevel=INFO

; Built paks to watch, separated by ';'. Each one overrides the installed mod pak of the same file name.
; Example: Paks=D:\MyMod\dist\Data\mymod.pak
Paks=

; How often each pak is checked, in milliseconds (100-10000).
PollMs=500

; How long, in seconds, clothing is checked for replaced skins and materials after a reload (5-600).
ResetWindowSeconds=60
