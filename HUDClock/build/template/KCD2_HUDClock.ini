; KCD2_HUDClock - shows the game time on the HUD.
;
; Keep this file next to KCD2_HUDClock.asi (ASI build) or KCD2_HUDClock.dll (KCSE build). Changes apply while the game
; runs: save the file and the clock updates.
;
; The clock shows while the HUD does, and in the minigames and modes [Visibility] names.
;
; PLACING THE PARTS
; The clock has five parts: the [Dial] and four text lines, [Line1] to [Line4]. Each part is pinned to something:
;   AttachTo     what it is pinned to: Screen, Dial, Line1, Line2, Line3 or Line4
;   AttachPoint  the point of that thing it is pinned to
;   Pivot        the point of this part that goes there
;   OffsetX/Y    then a nudge right (OffsetX) and down (OffsetY), in pixels of a 1080p screen. Negative moves left/up.
; Every part has these nine points:
;   TopLeft     Top     TopRight
;   Left        Center  Right
;   BottomLeft  Bottom  BottomRight
; A part that is off (the dial with Show=false, a line with an empty Format) takes no room, so what is pinned to it
; moves into its place.
;
; RECIPES (set these keys in their sections, keep the rest)
;
; By default the dial shows, with the game time centred under it.
;
; Game time right of the dial instead:
;   [Line1]   AttachPoint=Right, Pivot=Left, OffsetX=8, OffsetY=0
;
; No dial, the time alone in the corner:
;   [Dial]    Show=false
;   [Line1]   AttachPoint=Left, Pivot=Left, OffsetX=0, OffsetY=0
;
; Your computer's time under the game time, smaller:
;   [Line2]   Format={realtime}, FontSize=16
;
; A bigger clock: raise [Dial] Size and each line's FontSize together, for example Size=80 and FontSize=32.
;
; The clock in the top-right corner, text left of the dial:
;   [Dial]    AttachPoint=TopRight, Pivot=Right, OffsetX=-40
;   [Line1]   AttachTo=Dial, AttachPoint=Left, Pivot=Right, OffsetX=-8

[Settings]
; TRACE, DEBUG, INFO, WARNING, ERROR.
LogLevel = INFO

; false hides the clock.
Enabled = true

[Clock]
; How the tokens of every line's Format read.
; 24 (18:31) or 12 (6:31 PM), for {time} and {realtime}.
HourFormat = 24

; The words after a 12-hour time, morning first. Translate them freely.
AmPm = AM, PM

; The parts of the day {tod} names: <start hour>: <name>, each running until the next start hour. Hours are 0 to 23,
; one name per hour. Before the first start hour, the last name still runs from the evening before. Translate or
; regroup freely, for example "5: Morning, 12: Afternoon, 18: Evening, 22: Night".
Periods = 0: Midnight, 1: Late night, 5: Dawn, 6: Early morning, 9: Late morning, 12: Noon, 13: Early afternoon, 15: Late afternoon, 17: Early evening, 19: Late evening, 21: Dusk, 22: Early night

; How {realdate} reads, with these codes: %Y year, %y year (2 digits), %m month, %B month name, %b short month name,
; %d day, %e day (no leading zero), %A weekday, %a short weekday, %F same as %Y-%m-%d, %% a percent sign. Also
; supported: %c %D %H %I %j %M %p %R %S %T %U %w %W %x %X %z %Z. Examples: %d.%m.%Y shows 27.10.2026, %A %e %B shows
; Tuesday 27 October.
RealDateFormat = %Y-%m-%d

[Dial]
; The game's own sun and moon dial (from its wait screen), turned so the current hour sits under its pointer: the sun
; around noon, the moon around midnight, and the sky's colors at dawn and dusk.
Show = true
; Height in pixels of a 1080p screen (8-400).
Size = 60
; 0 (invisible) to 100 (opaque).
Opacity = 90
; true puts a dark copy of the arc behind it.
Shadow = true
; Where it sits (see PLACING THE PARTS at the top). By default its left middle sits 40 px right of and 48 px below
; the screen's top-left corner.
AttachTo = Screen
AttachPoint = TopLeft
Pivot = Left
OffsetX = 40
OffsetY = 48

[Line1]
; What the line shows. An empty Format hides the line. Any text outside these tokens shows as written:
;   {time}       the game time as a clock, as HourFormat says          18:31
;   {tod}        the part of the day by name (see Periods)              Early evening
;   {day}        the game's day count (Calendar.GetWorldDay)            149
;   {realtime}   your computer's time, as HourFormat says               21:07
;   {realdate}   your computer's date, as RealDateFormat says           2026-10-27
; Examples: "{time} - {tod}" shows 18:31 - Early evening. "Day {day}, {time}" shows Day 149, 18:31.
Format = {time}
; The game font: Regular, Bold, Light, Manuscript (handwritten) or Display (titles). Each follows the game's language.
Font = Regular
; Text height in pixels of a 1080p screen (6-200).
FontSize = 24
; Text color as RRGGBB. E8DCC4 is a parchment white.
Color = E8DCC4
; 0 (invisible) to 100 (opaque).
Opacity = 90
; true puts a dark copy behind the text, so it reads over bright skies.
Shadow = true
; Where it sits. By default its top middle sits 4 px under the dial's bottom middle. With the dial off it centres on
; the dial's place, so set AttachPoint=Left and Pivot=Left there for a longer Format (see RECIPES at the top).
AttachTo = Dial
AttachPoint = Bottom
Pivot = Top
OffsetX = 0
OffsetY = 4

[Line2]
; Off until it has a Format. Its keys mean the same as [Line1]'s. By default it sits centred under Line1.
Format =
Font = Regular
FontSize = 16
Color = E8DCC4
Opacity = 90
Shadow = true
AttachTo = Line1
AttachPoint = Bottom
Pivot = Top
OffsetX = 0
OffsetY = 2

[Line3]
; Off until it has a Format. By default it sits centred under Line2.
Format =
Font = Regular
FontSize = 16
Color = E8DCC4
Opacity = 90
Shadow = true
AttachTo = Line2
AttachPoint = Bottom
Pivot = Top
OffsetX = 0
OffsetY = 2

[Line4]
; Off until it has a Format. By default it sits centred under Line3.
Format =
Font = Regular
FontSize = 16
Color = E8DCC4
Opacity = 90
Shadow = true
AttachTo = Line3
AttachPoint = Bottom
Pivot = Top
OffsetX = 0
OffsetY = 2

[Visibility]
; The HUD parts the clock follows: it shows while any of them shows. Compass and Stats show in normal play and hide in
; menus and dialogue. Other parts: QAMWeapon, QAMFood, Subtitles, InfoText, GameLog, Hints, DialogLeft, DialogRight,
; Cursor, Crime, Wanted, PopUpBackground, TutorialMessage, FancyEvent, SkillCheck, ItemTransfer, Buffs, CommonEvent,
; DiceCursor, Trespassing, RatioStrips, ShootingContest, Bubbles, TutorialInDialog, DiceContainer, Vignette.
FollowHud = Compass, Stats

; The minigames the clock also shows in. It hides while a menu is open over one, such as the ingredient list, the help
; pages or the pause menu. Empty for none. All: Alchemy, Blacksmithing, Dice, Reading, LockPicking, Pickpocketing,
; HerbGathering, HoleDigging.
ShowInMinigames = Alchemy, Blacksmithing, Dice, Reading

; true also shows the clock in photo mode, so it appears in the screenshots.
ShowInPhotoMode = false

; true keeps the clock on screen. false hides it until ShowKey or ShowEveryHours shows it for ShowSeconds.
AlwaysShow = true

; Keys accept named keys, modifier combos (LShift+T), comma-separated alternatives (F6,Gamepad_LB+Gamepad_Y) and hex
; VK codes. Empty for none.
; Key names: https://github.com/tkhquang/DetourModKit?tab=readme-ov-file#supported-input-names
; Controllers are XInput only: https://github.com/tkhquang/DetourModKit?tab=readme-ov-file#gamepad-compatibility
; .Consume hides the key's last controller button or mouse wheel from the game, so it does not also trigger a game
; action. Keyboard keys always reach the game.
; .HoldTimeInSeconds is how long the key must stay down before it acts, so a quick tap does nothing (0-10). 0 acts on
; the press.
; ToggleKey switches between keeping the clock on screen and hiding it, until the game restarts or AlwaysShow changes.
ToggleKey =
ToggleKey.Consume = true
ToggleKey.HoldTimeInSeconds = 0
; ShowKey shows the clock for ShowSeconds.
ShowKey =
ShowKey.Consume = true
ShowKey.HoldTimeInSeconds = 0

; Real seconds the clock shows after ShowKey or ShowEveryHours (0.5-600).
ShowSeconds = 5

; Every this many game hours, counted from midnight, the clock shows for ShowSeconds: 1 on every full hour, 3 at 0:00,
; 3:00, 6:00 and so on. 0 never (0-24).
ShowEveryHours = 0
