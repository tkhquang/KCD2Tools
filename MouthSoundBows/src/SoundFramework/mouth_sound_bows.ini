; Chiuuu! Mouth-Sound Bows - a Sound Framework pack.
;
; Every bow and crossbow shot plays a man going "Chiuuu!" with his mouth instead of the string. Replaces takes game
; sound event paths (the [Debug] EventLog option of KCD2_SoundFramework.ini logs them): the game's event is muted and
; this sound plays at its position. See the Sound Framework modding guide for every key.
;
; KeepOriginal = true in a section keeps the game's own shot audible under the Chiuuu.

; Every bow shot, Henry's and every other archer's. The game's bow_shot starts with the draw and plays its release
; when the game sets the event's arrow_release parameter to 1, so the sound waits for that.
[mouth_sound_bows_shot]
Files = mouth_sound_bows_01.ogg, mouth_sound_bows_02.ogg
Bus = world
Space = 3d
VolumeVariation = 0.1
PitchVariation = 0.08
Replaces = event:/combat/weapons/bow/bow_shot
PlayAt = arrow_release:1
KeepOriginal = false

; Every crossbow shot. The game's crossbow_shot starts as the bolt fires, so it needs no PlayAt; a lower pitch for
; the heavier bolt.
[mouth_sound_bows_crossbow]
Files = mouth_sound_bows_01.ogg, mouth_sound_bows_02.ogg
Bus = world
Space = 3d
Pitch = 0.85
VolumeVariation = 0.1
PitchVariation = 0.08
Replaces = event:/combat/weapons/crossbow/crossbow_shot
KeepOriginal = false
