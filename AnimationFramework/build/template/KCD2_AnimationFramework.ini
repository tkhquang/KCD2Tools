; KCD2_AnimationFramework - lets animation mods work together instead of overwriting each other.
;
; Keep this file next to KCD2_AnimationFramework.dll (KCSE build) or KCD2_AnimationFramework.asi (ASI build).
; Changes apply on the next game start.

[Settings]
; TRACE, DEBUG, INFO, WARNING, ERROR.
LogLevel=INFO

[Features]
; Mods' Mannequin patches (<file>__<modid>.adb, clipswaps__<modid>.xml) merge into the databases the game loads, and
; mods that ship whole copies of the same database are merged with each other instead of the last one winning.
AnimationPatches=true

; Mods' animation clips (.caf) register in the game's clip index: new clips play, and a clip a mod ships again
; replaces the game's own, including the ones the game keeps in .dba packs. Whole Animations.img copies from several
; mods are merged.
ModClips=true

; Character skeletons (.chr) that several mods ship whole, such as mods that move the back slots of weapons and
; shields, merge bone by bone: each mod's moved bones are kept instead of the last mod's whole skeleton winning.
SkeletonMerge=true

; The game's human:PlayAnim(fragment, tags) and StopAnim(), which only work on Henry, also play animation actions
; (Mannequin fragments) on NPCs. The NPC's schedule takes over again when the action ends.
NpcActions=true

; Animations meant for the third-person view only: an option tagged player+thirdPerson plays for Henry while
; Proper Third Person View (TPV Camera) shows him from outside, and the game's own option plays in first person. Needs
; AnimationPatches, which adds the thirdPerson tag.
; Proper Third Person View: https://www.nexusmods.com/kingdomcomedeliverance2/mods/3263
ThirdPersonVariants=true

; Custom tags mods declare in their patches to Henry's tag definition (kcd_male_tags__<modid>.xml): each turns on
; through a console variable, and options tagged with it play for Henry while it is on. Needs AnimationPatches.
CustomTags=true

[CustomTags]
; Tag names, highest first, ranked above every other tag (the rest follow the priority their mods declare).
; Example: Priority=mymod_tired, thirdPerson
Priority=
; Tag names that never turn on, including thirdPerson.
Disabled=
