; KCD2_HenrySenses signature repairs.
;
; The mod finds every game function it uses with its own built-in signatures. When a game patch breaks one, the log
; names it ("Anchor <Label> unresolved" and "Feature gate: <Name> Fail"), and a repaired signature can be put in this
; file without a new build of the mod:
;
;   1. Set [Settings] ExportSignatures = true in KCD2_HenrySenses.ini and start the game once. The mod writes every
;      built-in signature to KCD2_HenrySenses.signatures.captured.ini.
;   2. Copy the [sig.<Label>] section of the broken signature, with its [sig.<Label>.rung.<N>] sections, below.
;   3. Fix its pattern. A signature in this file replaces the built-in one with the same label; every other signature
;      keeps its built-in form, and a malformed entry is ignored so the built-in one stands.
;
; A file written for another signature revision is ignored, because a newer build of the mod may already carry the
; fix. Comments must take whole lines.

[manifest]
schema = 1
revision = 1
