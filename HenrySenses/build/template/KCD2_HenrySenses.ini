; ============================================================================
; KCD2_HenrySenses configuration
; Highlight loot, creatures and world objects.
;
; Values apply live: save this file to apply changes without restarting the game.
;
; Each [Highlight.<Name>] section defines a group: what to highlight, its colors, hotkey and range. Add, remove,
; rename or reorder groups to suit your setup. The supplied groups are working examples you can freely customize.
; See HIGHLIGHT GROUPS below for options and an example of creating your own group.
;
; Keys accept named keys, modifier combos (LShift+H), comma-separated alternatives
; (H,Gamepad_RB+Gamepad_Start = H OR hold RB + press Start), and hex VK codes. Empty or NONE = unbound.
; Full input name reference:
;   https://github.com/tkhquang/DetourModKit?tab=readme-ov-file#supported-input-names
; ============================================================================

[Settings]
; LogLevel specifies the logging level: TRACE, DEBUG, INFO, WARNING, ERROR. DEBUG writes a state report to
; KCD2_HenrySenses.log on each config save and logs changes to loot-scan decisions. TRACE also logs common rejects
; (unrequested creatures, carried and held items).
; Default: INFO (use DEBUG for troubleshooting)
LogLevel = INFO

; ExportSignatures writes built-in signatures and captured baselines to KCD2_HenrySenses.signatures.captured.ini at
; startup. To fix a signature after a game patch, copy its section into KCD2_HenrySenses.signatures.ini and update
; the pattern there.
; Default: false
ExportSignatures = false

; Enabled is the master switch for all highlights.
; Default: true
Enabled = true

; --- Group defaults ---
; Key through HideIn apply to every group unless overridden in its [Highlight.<Name>] section.

; Key activates groups that have no hotkey of their own.
; Default: H, or hold RB + press Start on a controller.
;
; Key.Consume hides the combo's last button from the game while held, so the hotkey does not also trigger a game
; action. Only digital controller buttons and the mouse wheel can be consumed; modifiers, keyboard keys and analog
; triggers still reach the game.
; Default: true (set false to let the button reach the game as usual).
Key = H,Gamepad_RB+Gamepad_Start
Key.Consume = true

; Mode controls how the group's hotkey activates highlights:
;   Pulse  - show for Duration seconds; press again to restart the timer.
;   Toggle - switch on/off with each press.
;   Hold   - show while held.
;   Always - always show, no hotkey needed.
; Default: Pulse
Mode = Pulse

; Duration is how long a pulse stays at full brightness, in seconds.
; Default: 5.0
Duration = 5.0

; FadeOut is how long highlights take to fade after a pulse ends, a toggle is switched off or a hold key is released,
; in seconds. 0 = instant.
; Default: 1.0
FadeOut = 1.0

; Radius is the highlight range in meters, 2 to 100. Highlighted objects are drawn out to this range, even small
; items that the game normally hides after a few meters, so a larger Radius costs more performance.
; Default: 20.0
Radius = 20.0

; HideIn lists situations that hide highlights (comma-separated, case-insensitive; empty = never):
;   Dialogue  - a conversation.
;   Combat    - a weapon is drawn.
;   Minigame  - lockpicking, dice and other minigames.
; Default: Dialogue
HideIn = Dialogue

; ScanIntervalMs sets the rescan interval while a group highlights loot or creatures, in milliseconds.
; Default: 250
ScanIntervalMs = 250

; ===== HIGHLIGHT GROUPS =====
; Use one [Highlight.<Name>] section per group. Replace <Name> with a unique label of your choice, such as Gathering.
; Names must be unique, ignoring case. Add as many groups as needed, or rename/remove the supplied examples.
; The name is just a label: Targets, Only and Except define what the group highlights. Combine any supported
; target types in Targets to suit your tastes, or split them into separate groups with their own settings.
;
; --- Colors ---
; Use RRGGBB or RRGGBBAA hex. Pick or convert a color at https://www.fleevio.com/en/tools/color-picker
; Copy "HEX (no #)" or "HEX + alpha (no #)" and paste it into Color or after a target's colon:
;   Color = FF8000FF
;   Targets = Items:FF8000FF, Herbs:40FF40FF
; Six digits work too: FF8000 and FF8000FF give the same orange. AA (alpha) is ignored; use [Render] FillOpacity
; to adjust fill transparency and Style to choose outline or fill. FocusTint uses six digits only (RRGGBB).
;
; --- Targets ---
; Targets lists what to highlight, comma-separated. Append :RRGGBB or :RRGGBBAA to set an entry's color.
;   Kinds (the game's own rules decide what counts):
;     Loot:          Corpses, Carcasses, Items, Containers, Herbs
;     Creatures:     NPCs, Animals (includes horses, dogs and critters), Horses, Dogs,
;                    Critters (chickens, rats, mice, birds, fish)
;     Interactables: Doors, Workstations, Beds, Seats, UseSpots, Objects
;   Patterns (no loot rules; case-insensitive; * = any text, ? = one character):
;     Class:<pattern>  entity class                 Class:Stash, Class:*Stash
;     Name:<pattern>   entity name                  Name:*chest*, Name:kmis_dog*
;     Model:<pattern>  entity or static-world model  Model:*barrel*, Model:*/animals/*
;   To find classes and names, save this file while an interactables group is active, then read the
;   "Interactables: survey" lines in KCD2_HenrySenses.log. LogLevel = TRACE also logs each object with its class.
;
; --- Group options ---
; Each Key = Value line below names an optional group setting. Copy the lines you want, without the leading ;,
; into the desired [Highlight.<Name>] section, such as [Highlight.Loot].
;
; Enabled = true
;   Set false to disable the group. Default: true.
; Color = FFFFFFFF
;   Color for targets without their own. Default: FFFFFFFF (white).
; Only =
; Except =
;   Filter targets by tags or patterns. Only requires ALL entries; Except rejects ANY match.
;   Tags: Stolen, Locked, Empty, Butcherable, Hostile, Unconscious. Patterns use the same format as Targets.
;   Unconscious people match both Corpses and NPCs. Use Except = Unconscious to exclude them, or
;   Only = Unconscious to highlight them separately.
;   Default: empty (no filters)
; Style = OutlineFill
;   Choose Outline, Fill, OutlineFill or Box (corner brackets). If omitted, inherit [Render] Style.
;
; Focus = false
;   Set true to darken and tint the background while this group is active.
;   Adjust the amount with FocusDarken and FocusTint in the [Render] section.
;   Outline and OutlineFill objects stay bright; Fill and Box objects darken with the background.
;   Default: false
;
; [Experimental]
; Effect = HenrySenses.sparks
;   Add particles to each highlighted object; they follow moving targets, with one effect per herb patch.
;   Use HenrySenses.sparks or HenrySenses.glow for particles visible through walls. Both require
;   KCD2_HenrySenses.particles.xml beside this INI.
;   For a game effect hidden by walls, use Effect = particles_smithery.particles_smithery.sparks.
;   Default: disabled. Omit the setting, leave its value blank, or set Effect = None to disable particles.
;
; EffectScale = 1.0
;   Particle size multiplier, from 0.1 to 10. Default: 1.0. Only applies when Effect is enabled.
;
; Key, Key.Consume, Mode, Duration, FadeOut, Radius and HideIn inherit [Settings] unless set here.
;
; --- Priority ---
; Groups can share a hotkey: one press activates all of them, each with its own colors and style. When targets overlap,
; the LAST active group in this file wins. Put general groups first and overrides (e.g. stolen loot in red) below them.
;
; --- Examples ---
;   Only stolen loot, on its own key:     Targets = Items, Containers  / Only = Stolen / Key = F7
;   Good Citizen (never stolen loot):     add Except = Stolen to the loot groups
;   Empty chests in gray brackets:        Targets = Containers:808080FF / Only = Empty / Style = Box
;   Herbs far out, toggled:               Targets = Herbs / Key = F8 / Mode = Toggle / Radius = 40
;   Every barrel and anvil:               Targets = Model:*barrel*, Model:*anvil*:FF6000FF
;   Loot hidden in combat too:            HideIn = Dialogue, Combat, Minigame
;   Hunter's sense while a key is held:   Targets = NPCs, Animals / Key = G / Mode = Hold / Focus = true
; Each / separates settings to put on their own lines.
;
; --- Create your own group ---
; Copy this example to the end of the file and remove the leading ; from its setting lines and section header.
; F8 or RB + D-pad left toggles orange item outlines and green herb outlines within 40 meters.
; Copy it again with another unique name to create more combinations. Add Except = Stolen to skip stolen items.
; As the last group in the file, it takes priority over earlier active groups for overlapping targets.
;
; [Highlight.Gathering]
; Enabled = true
; Targets = Items:FF8000FF, Herbs:40FF40FF
; Style = Outline
; Key = F8,Gamepad_RB+Gamepad_DpadLeft
; Key.Consume = true
; Mode = Toggle
; Radius = 40

; Loot, excluding empty or stolen targets. Later groups can override these colors.
[Highlight.Loot]
Enabled = true
Targets = Corpses:00FFFFFF, Carcasses:3080FFFF, Items:FF8000FF, Containers:FFD000FF
Except = Empty,Stolen

; Butcherable carcasses.
[Highlight.Butcher]
Enabled = true
Targets = Carcasses
Only = Butcherable
Color = 80C0FFFF

; Locked containers, excluding empty ones.
; Disabled by default.
[Highlight.Locked]
Enabled = false
Targets = Containers
Only = Locked
Except = Empty
Color = B09000FF

; Stolen loot in red. Overrides earlier loot groups when enabled.
; Disabled by default.
[Highlight.Stolen]
Enabled = false
Targets = Items, Containers, Corpses, Carcasses
Only = Stolen
Except = Empty
Color = FF2020FF

; Unpicked herbs and mushrooms, outlined.
; Default hotkey: LShift+H, or hold RB + press Back on a controller.
[Highlight.Herbs]
Enabled = true
Targets = Herbs
Color = 40FF40FF
Style = Outline
Key = Lshift+H,Gamepad_RB+Gamepad_Back
Key.Consume = true

; [Experimental] Usable objects. Add Seats:8080C0FF for chairs, benches and stools; UseSpots covers wash tubs, kettles
; and similar objects. Books count as Workstations only when readable in place; others are Items.
; Disabled by default.
[Highlight.Places]
Enabled = false
Targets = Doors:60A0FFFF, Workstations:FF60FFFF, Beds:A080FFFF, UseSpots:40E0E0FF, Objects:E0E0E0FF

; Living people and animals, including your own. Horses and dogs get separate colors here.
; Disabled by default.
[Highlight.Living]
Enabled = false
Targets = NPCs:FFA0C0FF, Animals:C08040FF, Horses:E0B070FF, Dogs:D0D060FF

; Bandits, Cumans and other public enemies. Overrides Living when enabled.
; Disabled by default.
[Highlight.Hostiles]
Enabled = false
Targets = NPCs
Only = Hostile
Color = FF5000FF

; ===== RENDERING =====
[Render]
; Backend selects how highlights are drawn:
;   Auto    - use the game's silhouette renderer; fall back to corner brackets when unavailable.
;   Engine  - use the silhouette renderer only.
;   Markers - use corner brackets only.
; Default: Auto
Backend = Auto

; Style sets the default silhouette look. Each group can override it with its own Style.
;   Outline     - bright edges.
;   Fill        - a tint over the whole object.
;   OutlineFill - bright edges with a tinted fill.
; Default: OutlineFill
Style = OutlineFill

; OutlineWidth sets edge thickness in silhouette-mask pixels (Outline and OutlineFill).
; Default: 2.0
OutlineWidth = 2.0

; Strength sets edge brightness (Outline and OutlineFill). Higher = brighter.
; Default: 0.5
Strength = 0.5

; FillOpacity sets fill transparency for Fill and OutlineFill, 0.0 (invisible) to 1.0 (opaque).
; Default: 0.35
FillOpacity = 0.35

; Softness blurs the silhouette before drawing its outline, in pixels. Higher values merge small details into a glow
; and thin the outline. 0.0 = sharp edges.
; Default: 0.0
Softness = 0.0

; FadeStart is the distance in meters where highlights start dimming, reaching MinOpacity at the group's Radius.
; Default: 12.0
FadeStart = 12.0

; MinOpacity is the lowest brightness during distance fading, 0.0 to 1.0.
; Default: 1.0 (no distance fading)
MinOpacity = 1.0

; FadePower shapes distance fading: 1.0 = linear; higher values keep highlights brighter farther out.
; Default: 1.0
FadePower = 1.0

; SeeThrough shows highlights through walls, grass and other objects. Set false to highlight only visible surfaces
; and hide markers behind walls.
; Default: true
SeeThrough = true

; RenderAlways keeps fully hidden objects available to the silhouette renderer, so they can still be highlighted
; behind walls. Requires the silhouette renderer and SeeThrough = true. Restored when highlights end.
; Default: true
RenderAlways = true

; FocusDarken dims the background while a group with Focus = true is active, 0.0 (no darkening) to 1.0 (black).
; Eases in over FocusFadeIn and out with the group's FadeOut.
; Default: 0.5
FocusDarken = 0.5

; FocusTint sets the background tint for Focus groups. Use six-digit RRGGBB hex without # (see Colors above).
; FFFFFF = no tint.
; Default: B8C4D8
FocusTint = B8C4D8

; FocusFadeIn sets how long the focus effect takes to appear, in seconds (0 to 10; 0 = instant).
; Default: 0.4
FocusFadeIn = 0.4
