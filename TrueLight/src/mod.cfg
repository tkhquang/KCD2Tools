; True Light - Real Torch Shadows
; Save, then run true_light_reload in the console.

; Views: 1 = real torch light from the flame, 0 = the game's own.
; third person (TPVCamera or any camera mod)
true_light_third_person 1

; first person
true_light_first_person 0

; photo mode
true_light_photo_mode 1

; Size of the real torch light in metres, above 0. Smaller = dimmer light and a lighter shadow of Henry, same reach.
; 1 = the game's light for Henry's torch, 0.3 = an NPC's torch.
true_light_bulb_size 1

; Lights from other mods (torches and Lamp lanterns are built in). Remove the ; to use a line.
;   true_light_held_light <class | name:prefix> [helper | -] [state | -]
; true_light_held_light MyLantern
; true_light_held_light name:my_candle_ flame_helper
