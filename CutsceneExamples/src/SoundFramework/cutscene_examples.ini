; Cutscene Examples - a Sound Framework pack.
;
; Henry's and Magdalena's lines in this mod's dialog are the mod's own keys, so the game has no recording for them.
; These lines play Henry's and Magdalena's own recorded lines from the game in their place; the dialog shows its own
; subtitle, which matches what they say. Without Sound Framework the lines stay silent, subtitles only.

