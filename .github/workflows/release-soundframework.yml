name: Sound Framework - Version Bump and Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version_part:
        description: "Version part to bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      version_title:
        description: "Version title (defaults to the heading in NEXT_CHANGELOG.md)"
        required: false
        type: string
      nexus_description:
        description: "Nexus file note (appended after each file's build line; truncated to fit 255 chars total)"
        required: false
        type: string
      prerelease:
        description: "Is this a pre-release?"
        required: false
        default: false
        type: boolean

# Releases share the same version header and tag namespace across branches.
concurrency:
  group: release-soundframework
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  bump-and-release:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release branch and initialize dependencies
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'branch') {
            throw 'Run this workflow on a branch, not a tag.'
          }
          # Only fetch this mod's dependency tree; other mods and CryEngine are not needed.
          git submodule update --init --recursive -- SoundFramework/external/DetourModKit
          if ($LASTEXITCODE -ne 0) { throw 'Failed to initialize SoundFramework submodules.' }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Read changelog and determine title
        id: read-changelog
        env:
          TITLE_INPUT: ${{ inputs.version_title }}
        run: |
          $content = Get-Content -LiteralPath 'SoundFramework/docs/NEXT_CHANGELOG.md' -Raw -Encoding utf8
          $lines = $content -split "`r?`n"
          if ($lines[0] -notmatch '^##\s+(.+)$') {
            throw 'NEXT_CHANGELOG.md must start with ## followed by a release title.'
          }
          $suggestedTitle = $matches[1].Trim()
          if ($suggestedTitle -eq '[Title for next release]') {
            throw 'Replace the NEXT_CHANGELOG.md template with release notes before publishing.'
          }
          $title = ([string]$env:TITLE_INPUT).Trim()
          if ([string]::IsNullOrWhiteSpace($title)) { $title = $suggestedTitle }
          if ($title -match '[\r\n]') { throw 'The release title must be a single line.' }
          $changelog = ($lines | Select-Object -Skip 1) -join "`n"
          if ([string]::IsNullOrWhiteSpace($changelog)) { throw 'The changelog must not be empty.' }
          $notesPath = Join-Path $env:RUNNER_TEMP 'soundframework-changelog.txt'
          Set-Content -LiteralPath $notesPath -Value $changelog.Trim() -Encoding utf8
          "TITLE=$title" >> $env:GITHUB_OUTPUT
          "NOTES_PATH=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Bump version and update changelog
        env:
          VERSION_PART: ${{ inputs.version_part }}
          RELEASE_TITLE: ${{ steps.read-changelog.outputs.TITLE }}
          NOTES_PATH: ${{ steps.read-changelog.outputs.NOTES_PATH }}
        run: |
          python SoundFramework/scripts/version_updater.py bump $env:VERSION_PART --title $env:RELEASE_TITLE --changelog-file $env:NOTES_PATH
          if ($LASTEXITCODE -ne 0) { throw 'Version update failed.' }

          $header = Get-Content "SoundFramework\src\version.hpp" -Raw
          $major = [regex]::Match($header, '#define\s+VERSION_MAJOR\s+(\d+)').Groups[1].Value
          $minor = [regex]::Match($header, '#define\s+VERSION_MINOR\s+(\d+)').Groups[1].Value
          $patch = [regex]::Match($header, '#define\s+VERSION_PATCH\s+(\d+)').Groups[1].Value
          $version = "$major.$minor.$patch"
          $tag = "SoundFramework-v$version"
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists. Choose a different version bump." }
          if ($LASTEXITCODE -ne 1) { throw 'Failed to check existing release tags.' }
          "NEW_VERSION=$version" >> $env:GITHUB_ENV
          "VERSION_TAG=v$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "ARTIFACT_NAME=KCD2_SoundFramework_v$version.zip" >> $env:GITHUB_ENV
          "KCSE_ARTIFACT_NAME=KCD2_SoundFramework_KCSE_v$version.zip" >> $env:GITHUB_ENV
          # show-ref returns 1 for the expected missing tag; do not report that as a step failure.
          exit 0

      - name: Build ASI, KCSE plugin and tests
        working-directory: SoundFramework
        run: |
          cmake -S . -B build/release-msvc -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }
          cmake --build build\release-msvc --config Release --parallel --target KCD2_SoundFramework-ASI KCD2_SoundFramework-KCSE sndfw_packs_tests sndfw_voice_tests sndfw_lipmodel_tests
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          foreach ($artifact in 'build\release-msvc\KCD2_SoundFramework.asi', 'build\release-msvc\KCSE\KCD2_SoundFramework.dll') {
            if (-not (Test-Path $artifact)) { throw "$artifact was not produced" }
          }

      - name: Run unit tests
        working-directory: SoundFramework
        run: |
          ctest --test-dir build\release-msvc -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed.' }

      # ASI archive: everything at the root, extracted beside WHGame.dll. KCSE archive: a regular mod folder whose
      # KCSE/Plugins/ holds the DLL with the same runtime files beside it. The folder is named after the modid, as
      # the game's modding guide recommends; a modid allows only lowercase letters and underscores, and
      # mod_order.txt lists mods by it.
      - name: Assemble release archives
        run: |
          $template = "SoundFramework\build\template\*"
          $license = "SoundFramework\LICENSE"

          $asiPackage = "SoundFramework\package\asi"
          New-Item -ItemType Directory -Force -Path $asiPackage | Out-Null
          Copy-Item "SoundFramework\build\release-msvc\KCD2_SoundFramework.asi" $asiPackage
          Copy-Item $template $asiPackage -Recurse
          Copy-Item $license (Join-Path $asiPackage 'KCD2_SoundFramework_License.txt')
          Compress-Archive -Path "$asiPackage\*" -DestinationPath $env:ARTIFACT_NAME -Force

          $kcsePackage = "SoundFramework\package\kcse"
          $modId = 'soundframework'
          $modDir = Join-Path $kcsePackage $modId
          $pluginDir = Join-Path $modDir 'KCSE\Plugins'
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null
          Copy-Item "SoundFramework\build\release-msvc\KCSE\KCD2_SoundFramework.dll" $pluginDir
          Copy-Item $template $pluginDir -Recurse
          Copy-Item $license (Join-Path $pluginDir 'KCD2_SoundFramework_License.txt')
          $manifest = @'
          <?xml version="1.0" encoding="utf-8"?>
          <kcd_mod>
            <info>
              <name>Sound Framework (KCSE plugin)</name>
              <modid>{1}</modid>
              <description>Custom sounds and voices with lip sync for mods. Needs Kingdom Come Script Extender (KCSE).</description>
              <author>tkhquang</author>
              <version>{0}</version>
              <created_on>2026-10-19</created_on>
              <modifies_level>false</modifies_level>
            </info>
          </kcd_mod>
          '@
          $manifest = $manifest -f $env:NEW_VERSION, $modId
          Set-Content -LiteralPath (Join-Path $modDir 'mod.manifest') -Value $manifest -Encoding utf8
          Compress-Archive -Path $modDir -DestinationPath $env:KCSE_ARTIFACT_NAME -Force

          Get-ChildItem -Recurse "SoundFramework\package" | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200

      - name: Prepare release body and Nexus metadata
        id: prepare-release
        env:
          RELEASE_TITLE: ${{ steps.read-changelog.outputs.TITLE }}
          NOTES_PATH: ${{ steps.read-changelog.outputs.NOTES_PATH }}
          NEXUS_DESC_INPUT: ${{ inputs.nexus_description }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $changelog = Get-Content -LiteralPath $env:NOTES_PATH -Raw -Encoding utf8
          $releaseBody = @'
          # Kingdom Come: Deliverance II - Sound Framework

          ## Release {0} - {1}

          Custom sounds and voices for mods: new sounds and voice lines, replacements for the game's own, subtitles, lip sync and facial moods.

          ## Changelog

          {2}

          ### Installation

          The framework comes in two builds. **Install one of them, not both.**

          **ASI build** (`{4}`):

          1. Install one **x64** variant of [Ultimate ASI Loader](https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases) if you do not already have a working ASI loader. Extract its DLL beside `WHGame.dll` in `<game>/Bin/Win64MasterMasterSteamPGO/` (Steam); other stores use their own `Bin/Win64MasterMaster...` folder. Choose an unused DLL name:
             - [dinput8.dll](https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/x64-latest/dinput8-x64.zip) - usual choice if unused
             - [version.dll](https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/x64-latest/version-x64.zip) - alternative when `dinput8.dll` is already used
             - [winmm.dll](https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/x64-latest/winmm-x64.zip) - another alternative

             KCSE also loads `.asi` files beside its `dinput8.dll`, so KCSE users need no separate loader.
          2. Extract the archive directly into that same binary folder, beside `WHGame.dll`, without an extra archive-named subfolder.

          **KCSE build** (`{5}`): install [Kingdom Come Script Extender](https://www.nexusmods.com/kingdomcomedeliverance2/mods/3332), then extract the archive into `<game>/Mods/` or install it with a mod manager. The DLL and its files land in `Mods/soundframework/KCSE/Plugins/`.

          Load a save and check `KCD2_SoundFramework.log` beside the mod: it lists every sound pack found. Edit `KCD2_SoundFramework.ini` and save to apply changes while playing. Back up your customized INI before updating.

          See the [README](https://github.com/{3}/blob/main/SoundFramework/README.md) for configuration and the [modding guide](https://github.com/{3}/blob/main/SoundFramework/docs/MODDING.md) to make sound packs.

          ### AI Disclosure and License

          Advanced lip sync is machine-learned: a small neural network, trained on the game's own voice lines and facial animation, generates the mouth movement (facial animation only). Set `[LipSync] Mode = BASIC` to use the mouth without machine learning.

          The code is MIT licensed. `KCD2_SoundFramework_lipmodel.bin` is derived from Kingdom Come: Deliverance II game data owned by Warhorse Studios and PLAION. The MIT license does not cover it: use it only with KC:D 2 through this mod, and not in other games, other products or commercially.

          ### Technical Details

          Sound Framework is built on [DetourModKit (DMK)](https://github.com/tkhquang/DetourModKit), a full-featured C++23 framework for Windows game modding. It provides:

          - Function hooking via [SafetyHook](https://github.com/cursey/safetyhook) and vtable hooking
          - AOB (Array of Bytes) pattern scanning and memory access utilities
          - INI configuration with live reload
          - Thread-safe logging and runtime diagnostics
          - Mod lifecycle management and hot-reload support
          '@
          $releaseBody = $releaseBody -f $env:VERSION_TAG, $env:RELEASE_TITLE, $changelog.Trim(), $env:GITHUB_REPOSITORY, $env:ARTIFACT_NAME, $env:KCSE_ARTIFACT_NAME
          if ($env:PRERELEASE -eq 'true') {
            $releaseBody = "## PRE-RELEASE VERSION`n`nThis build is for testing and may contain bugs or incomplete features.`n`n" + $releaseBody
          }
          $bodyPath = Join-Path $env:RUNNER_TEMP 'soundframework-release-body.md'
          Set-Content -LiteralPath $bodyPath -Value $releaseBody -Encoding utf8
          "RELEASE_BODY_PATH=$bodyPath" >> $env:GITHUB_OUTPUT

          # Nexus accepts a 255-character file note, BBCode tags included, and a plain bullet-list changelog. Each
          # file opens with its own build and requirement line, and the optional note fills what is left.
          $asiLead = 'ASI build: needs an [url=https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases]ASI loader[/url]. Extract it beside WHGame.dll by hand. Install this or the KCSE build, not both. See the description for installation steps.'
          $kcseLead = 'KCSE build: needs [url=https://www.nexusmods.com/kingdomcomedeliverance2/mods/3332]KCSE[/url]. Installs into Mods, or with a mod manager. Install this or the ASI build, not both. See the description for installation steps.'
          $note = ($env:NEXUS_DESC_INPUT -replace "`r`n", "`n").Trim()
          function Format-FileNote([string]$lead) {
            if ($note -eq '') { return $lead }
            $remaining = 255 - $lead.Length - 2
            if ($remaining -le 0) { return $lead }
            return "$lead`n`n" + $note.Substring(0, [Math]::Min($note.Length, $remaining))
          }
          $nexusChangelog = (($changelog -split "`r?`n") |
            ForEach-Object { ($_.Trim() -replace '^[-*+]\s+', '') } |
            Where-Object { $_ -ne '' }) -join "`n"
          $delimiter = "NEXUS_$([guid]::NewGuid().ToString('N'))"
          "NEXUS_ASI_DESCRIPTION<<$delimiter" >> $env:GITHUB_OUTPUT
          (Format-FileNote $asiLead) >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT
          "NEXUS_KCSE_DESCRIPTION<<$delimiter" >> $env:GITHUB_OUTPUT
          (Format-FileNote $kcseLead) >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT
          "NEXUS_CHANGELOG<<$delimiter" >> $env:GITHUB_OUTPUT
          $nexusChangelog >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Commit version changes and create release tag
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git config --local user.name 'github-actions[bot]'
          git add -- SoundFramework/src/version.hpp SoundFramework/CHANGELOG.md SoundFramework/build/template/KCD2_SoundFramework_Readme.txt
          if ($LASTEXITCODE -ne 0) { throw 'Failed to stage version changes.' }
          git commit -m "Bump SoundFramework version to $env:NEW_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to commit version changes.' }
          git tag -a $env:RELEASE_TAG -m "Release $env:VERSION_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create release tag.' }

          # The tag always contains the source used to build the archives. Pre-releases keep
          # the bump on the tag only, leaving the selected branch and pending notes untouched.
          if ($env:PRERELEASE -eq 'true') {
            git push origin "refs/tags/$env:RELEASE_TAG"
          } else {
            git push --atomic origin "HEAD:refs/heads/$env:GITHUB_REF_NAME" "refs/tags/$env:RELEASE_TAG"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to push release changes.' }

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ${{ env.ARTIFACT_NAME }}
            ${{ env.KCSE_ARTIFACT_NAME }}
          name: KCD2 SoundFramework ${{ env.VERSION_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ steps.prepare-release.outputs.RELEASE_BODY_PATH }}
          draft: false
          prerelease: ${{ inputs.prerelease }}

      # The account API key is shared; file and v3 mod IDs identify this mod. Each archive is its own Nexus file:
      # leave a file ID unset to skip that upload. mod_id is required only for changelogs, which the main file posts.
      # The ASI build is the main file. It installs by hand beside WHGame.dll, so mod manager downloads stay off.
      - name: Publish ASI build to Nexus Mods
        if: ${{ !inputs.prerelease && vars.NEXUSMODS_SOUNDFRAMEWORK_FILE_ID != '' }}
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_SOUNDFRAMEWORK_FILE_ID }}
          filename: ${{ env.ARTIFACT_NAME }}
          version: ${{ env.NEW_VERSION }}
          display_name: (ASI) Sound Framework
          description: ${{ steps.prepare-release.outputs.NEXUS_ASI_DESCRIPTION }}
          category: main
          archive_existing_version: false
          primary_mod_manager_download: false
          allow_mod_manager_download: false
          show_requirements_pop_up: true
          update_mod_version: true
          mod_id: ${{ vars.NEXUSMODS_SOUNDFRAMEWORK_MOD_ID }}
          changelog: ${{ vars.NEXUSMODS_SOUNDFRAMEWORK_MOD_ID != '' && steps.prepare-release.outputs.NEXUS_CHANGELOG || '' }}

      # The KCSE archive is a regular Mods folder entry, so mod managers can install it.
      - name: Publish KCSE build to Nexus Mods
        if: ${{ !inputs.prerelease && vars.NEXUSMODS_SOUNDFRAMEWORK_KCSE_FILE_ID != '' }}
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_SOUNDFRAMEWORK_KCSE_FILE_ID }}
          filename: ${{ env.KCSE_ARTIFACT_NAME }}
          version: ${{ env.NEW_VERSION }}
          display_name: (KCSE) Sound Framework
          description: ${{ steps.prepare-release.outputs.NEXUS_KCSE_DESCRIPTION }}
          category: main
          archive_existing_version: false
          primary_mod_manager_download: true
          allow_mod_manager_download: true
          show_requirements_pop_up: true
          update_mod_version: false

      - name: Archive NEXT_CHANGELOG.md
        if: ${{ !inputs.prerelease && success() }}
        run: |
          git pull --ff-only origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Failed to update the release branch before archiving.' }
          $archiveDir = 'SoundFramework/docs/archive'
          $notesPath = 'SoundFramework/docs/NEXT_CHANGELOG.md'
          $archivePath = "$archiveDir/CHANGELOG_$env:VERSION_TAG.md"
          New-Item -ItemType Directory -Path $archiveDir -Force | Out-Null
          Move-Item -LiteralPath $notesPath -Destination $archivePath
          $template = @'
          ## [Title for next release]

          - New feature
          - Bug fix
          - Improvement
          '@
          Set-Content -LiteralPath $notesPath -Value $template -Encoding utf8
          git add -- $notesPath $archivePath
          if ($LASTEXITCODE -ne 0) { throw 'Failed to stage the archived changelog.' }
          git commit -m "Chore: Archive SoundFramework changelog for $env:VERSION_TAG and prepare for next release"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to commit the archived changelog.' }
          git push origin "HEAD:refs/heads/$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to push the archived changelog.' }
